<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CCS Sit-in Monitoring</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="register-wrapper">
        <div class="register-container">

            <div class="register-content">
                <div class="form-column">

                    <div class="reg-header">
                        <img src="images/register.png" alt="Register Icon">
                        <h1 class="align-left">Registration</h1>
                    </div>

                    <form action="#" method="POST">

                        <div class="reg-input-group">
                            <input type="text" placeholder="🪪 ID Number" required>
                        </div>

                        <div class="reg-input-group">
                            <input type="text" placeholder="👤 Last Name" required>
                        </div>

                        <div class="reg-input-group">
                            <input type="text" placeholder="👤 First Name" required>
                        </div>

                        <div class="reg-input-group">
                            <input type="text" placeholder="👤 Middle Name" required>
                        </div>

                        <div class="reg-input-group">
                            <input list="course-levels" placeholder="🧑‍🎓 Course Level" required>
                            <datalist id="course-levels">
                                <option value="1st year">
                                <option value="2nd year">
                                <option value="3rd year">
                                <option value="4th year">
                            </datalist>
                        </div>

                        <div class="reg-input-group">
                            <input type="password" id="pass1" placeholder="🔒 Password" required>
                            <span class="password-toggle" onclick="togglePass('pass1')">🧿</span>
                        </div>

                        <div class="reg-input-group">
                            <input type="password" id="pass2" placeholder="🔐 Confirm Password" required>
                            <span class="password-toggle" onclick="togglePass('pass2')">🧿</span>
                        </div>

                        <div class="reg-input-group">
                            <input type="email" placeholder="✉️ Email" required>
                        </div>

                        <div class="reg-input-group">
                            <input list="courses" placeholder="📚 Course" required>
                            <datalist id="courses">
                                <option value="BSIT">
                                <option value="BSCS">
                                <option value="BSCE">
                                <option value="BSBA">
                            </datalist>
                        </div>

                        <div class="reg-input-group">
                            <input type="text" placeholder="🏠 Address" required>
                        </div>

                        <div class="btn-center">
                            <button type="submit" class="reg-submit-btn">Register</button>
                            <div class="cancel-center"><a href="index.html" class="cancel-btn">Cancel</a></div>
                        </div>

                    </form>
                </div>

                <div class="image-column">
                    <img src="images/signup.png" alt="Registration Illustration">
                </div>
                
            </div>
        </div>
    </div>

</body>
<script>
    function togglePass(id) {
        const input = document.getElementById(id);
        const icon = input.nextElementSibling;
        
        if (input.type === "password") {
            input.type = "text";
            icon.textContent = "🚫";
        } else {
            input.type = "password";
            icon.textContent = "🧿";
        }
    }
</script>
</html>
