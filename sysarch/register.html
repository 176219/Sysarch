<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CCS Sit-in Monitoring</title>
    <link rel="stylesheet" href="register.css">
    <script src="register.js"></script>
    
</head>
<body>

    <div class="register-wrapper">
        <div class="register-container">

            <div class="register-content">
                <div class="form-column">

                    <div class="reg-header">
                        <img src="images/register.png" alt="Register Icon">
                        <h1 class="align-left">Registration</h1>
                    </div>

                    <form id="registerForm">

                        <div class="reg-input-group">
                            <input type="text" name="idNumber" placeholder="🪪 ID Number" required>
                        </div>

                        <div class="reg-input-group">
                            <input type="text" name="lastName" placeholder="👤 Last Name" required>
                        </div>

                        <div class="reg-input-group">
                            <input type="text" name="firstName" placeholder="👤 First Name" required>
                        </div>

                        <div class="reg-input-group">
                            <input type="text" name="middleName" placeholder="👤 Middle Name" required>
                        </div>

                        <div class="reg-input-group">
                            <input list="course-levels" name="yearLevel" placeholder="🧑‍🎓 Course Level" required>
                            <datalist id="course-levels">
                                <option value="1st year">
                                <option value="2nd year">
                                <option value="3rd year">
                                <option value="4th year">
                            </datalist>
                        </div>

                        <div class="reg-input-group">
                            <input type="password" id="pass1" name="password" placeholder="🔒 Password" required>
                            <span class="password-toggle" onclick="togglePass('pass1')">🧿</span>
                        </div>

                        <div class="reg-input-group">
                            <input type="password" id="pass2" name="confirmPassword" placeholder="🔐 Confirm Password" required>
                            <span class="password-toggle" onclick="togglePass('pass2')">🧿</span>
                        </div>

                        <div class="reg-input-group">
                            <input type="email" name="email" placeholder="✉️ Email" required>
                        </div>

                        <div class="reg-input-group">
                            <input list="courses" name="course" placeholder="📚 Course" required>
                            <datalist id="courses">
                                <option value="BSIT">
                                <option value="BSCS">
                                <option value="BSCE">
                                <option value="BSBA">
                            </datalist>
                        </div>

                        <div class="reg-input-group">
                            <input type="text" name="address" placeholder="🏠 Address" required>
                        </div>  

                        <div class="btn-center">
                            <button type="submit" class="reg-submit-btn">Register</button>
                            <div class="cancel-center"><a href="login.html" class="cancel-btn">Cancel</a></div>
                        </div>

                    </form>
                </div>

                <div class="image-column">
                    <img src="images/signup.png" alt="Registration Illustration">
                </div>
                
            </div>
        </div>
    </div>

</body>
</html>
