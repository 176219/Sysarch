<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - CCS Portal</title>
    <link rel="stylesheet" href="editprofile.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>  
</head>
<body>
    <nav class="navbar">
        <div class="logo-text">Edit Profile Students</div>
        <ul class="nav-links">
            <li><a href="#">✉ Notification 🔻</a></li>
            <li><a href="dashboard.html">🏠︎ Dashboard</a></li>
            <li><a href="editprofile.html" class="active">✎ Edit Profile</a></li>
            <li><a href="history.html">🕮 History</a></li>
            <li><a href="reservation.html">🗒 Reservation</a></li>
            <li><a href="#" class="logout">➜] Logout</a></li>
        </ul>
    </nav>

    <div class="register-wrapper"> 
        <div class="register-container">
            <div class="register-content">
                
                <!-- Form Column -->
                <div class="form-column">
                    <form id="editProfileForm">
                        <div class="reg-input-group">
                            <input type="text" id="edit-id" placeholder="ⵌ ID Number" required>
                        </div>

                        <div class="reg-input-group">
                            <input type="text" id="edit-lastName" placeholder="👤 Last Name" required>
                        </div>

                        <div class="reg-input-group">
                            <input type="text" id="edit-firstName" placeholder="👤 First Name" required>
                        </div>

                        <div class="reg-input-group">
                            <input type="text" id="edit-middleName" placeholder="👤 Middle Name">
                        </div>

                        <div class="row-group">
                            <div class="reg-input-group">
                                <input id="edit-yearLevel" list="course-levels" placeholder="🧑‍🎓 Year Level" required>
                                <datalist id="course-levels">
                                    <option value="1st year">
                                    <option value="2nd year">
                                    <option value="3rd year">
                                    <option value="4th year">
                                </datalist>
                            </div>

                            <div class="reg-input-group">
                                <input id="edit-course" list="courses" placeholder="📚 Course" required>
                                <datalist id="courses">
                                    <option value="BSIT">
                                    <option value="BSCS">
                                    <option value="BSCE">
                                    <option value="ACT">
                                </datalist>
                            </div>
                        </div>

                        <div class="reg-input-group">
                            <input type="email" id="edit-email" placeholder="✉️ Email" required>
                        </div>

                        <div class="reg-input-group">
                            <input type="text" id="edit-address" placeholder="🏠 Address" required>
                        </div>

                        <div class="btn-center">
                            <button type="submit" id="saveBtn" class="reg-submit-btn">Save</button>
                        </div>
                    </form>
                </div>

                <!-- Image Column (Profile Preview + Illustration) -->
                <div class="image-column">
                    <!-- Profile Preview -->
                    <div style="margin-bottom: 20px; text-align: center;">
                        <img id="profilePreview" src="images/default.png" alt="Profile Photo" class="profile-image">
                        <input type="file" id="photoUpload" accept="image/*" style="display: none;">
                        <button type="button" onclick="document.getElementById('photoUpload').click()" 
                            class="reg-submit-btn" style="margin-top: 10px; font-size: 14px;">Change Photo</button>
                    </div>


                    
                </div>
                
            </div>
        </div>
    </div>

    <script src="editprofile.js"></script>
    <script src="logout.js"></script>
</body>
</html>
